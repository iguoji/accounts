# 集中管理各个子系统的 docker 服务。
# 目前包含代理池（services/proxies）与其依赖的 Redis。
# 使用：在仓库根目录执行 "docker compose up -d --build" 即可构建并启动。
services:
  redis:
    image: redis:7-alpine
    container_name: accounts-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --port
      - "${REDIS_PORT}"
    ports:
      # Redis 监听端口与宿主机映射端口统一由根目录 .env 管理。
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      # Redis 持久化数据（AOF + RDB），即使删容器也不丢失
      - ./data/redis:/data
    environment:
      TZ: "${TZ}"

  proxies:
    build:
      context: .
      dockerfile: services/proxies/Dockerfile
    image: accounts-proxies:latest
    container_name: accounts-proxies
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      # Redis 连接、代理池监听地址及端口均从根目录 .env 注入。
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"
      PROXIES_HOST: "${PROXIES_HOST}"
      PROXIES_PORT: "${PROXIES_PORT}"
      PROXIES_DEAD_REVIVE_AFTER: "${PROXIES_DEAD_REVIVE_AFTER:-21600}"
      # 调试模式：开启后测活/采集/调度的详细日志输出到 logs/proxies/debug.log
      # 每次服务启动会清空 debug.log 重新记录；排查问题后改回 false 关闭
      PROXIES_DEBUG: "${PROXIES_DEBUG:-false}"
      PROXIES_DEBUG_LOG_MAX_MB: "${PROXIES_DEBUG_LOG_MAX_MB:-20}"
      PROXIES_DEBUG_LOG_KEEP_FILES: "${PROXIES_DEBUG_LOG_KEEP_FILES:-3}"
      PROXIES_DEBUG_SUMMARY_INTERVAL: "${PROXIES_DEBUG_SUMMARY_INTERVAL:-60}"
      # 让容器日志时间与宿主机一致（本地时区），默认东八区，可按需改 TZ
      TZ: "${TZ}"
    ports:
      # 宿主机绑定地址、宿主机端口和容器监听端口统一由根目录 .env 管理。
      - "${PROXIES_HOST}:${PROXIES_PORT}:${PROXIES_PORT}"
    volumes:
      # 日志持久化到宿主机，即使删容器也不丢失
      - ./logs:/srv/logs
      # 配置与数据源清单可直接在宿主机编辑，容器内实时生效
      - ./.env:/srv/.env:ro
      - ./services/proxies/source.yaml:/srv/services/proxies/source.yaml:ro
