# 集中管理各个子系统的 docker 服务。
# 目前包含代理池（services/proxies）与其依赖的 Redis。
# 使用：在仓库根目录执行 "docker compose up -d --build" 即可构建并启动。
services:
  redis:
    image: redis:7-alpine
    container_name: accounts-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1000
    ports:
      # 宿主机 6379 → 容器 6379（其他子系统如需连接宿主机 Redis 也走这里）
      - "6379:6379"
    volumes:
      # Redis 持久化数据（AOF + RDB），即使删容器也不丢失
      - ./data/redis:/data
    environment:
      - TZ=Asia/Shanghai

  proxies:
    build:
      context: .
      dockerfile: services/proxies/Dockerfile
    image: accounts-proxies:0.1.1
    container_name: accounts-proxies
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      # Redis 连接（指向同网络的 redis 服务）
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # 调试模式：开启后测活/采集/调度的详细日志输出到 logs/proxies/debug.log
      # 每次服务启动会清空 debug.log 重新记录；排查问题后改回 false 关闭
      - DEBUG=false
      # 让容器日志时间与宿主机一致（本地时区），默认东八区，可按需改 TZ
      - TZ=Asia/Shanghai
    ports:
      # 宿主机 3000 → 容器 3000（改宿主机端口请改左边；容器端口与 .env 的 PORT 对应）
      - "3000:3000"
    volumes:
      # 日志持久化到宿主机，即使删容器也不丢失
      - ./logs:/srv/logs
      # 配置与数据源清单可直接在宿主机编辑，容器内实时生效
      - ./.env:/srv/.env:ro
      - ./services/proxies/source.yaml:/srv/services/proxies/source.yaml:ro
